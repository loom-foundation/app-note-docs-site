name: checks

# The site's content comes from corpus-note. A workflow sends corpus-updated when
# main moves, and that rebuilds and redeploys exactly as a push or merge in this
# repository would.
# workflow_dispatch does the same by hand, from the Actions tab or `gh workflow
# run`, for when a deploy is wanted without a PR merge to wait for.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  repository_dispatch:
    types: [corpus-updated]

# This application depends on the following repositories:
# - workspace: List of repositories and their placement
# - corpus-note: Site content
# - org: Brand assets
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Check out note-docs-site via actions/checkout, so it lands on the exact PR/push ref being tested.
      - uses: actions/checkout@v7
        with:
          path: apps/note-docs-site
      # Check out the workspace, so other repositories this application depends on can be cloned.
      - uses: actions/checkout@v7
        with:
          repository: loom-foundation/workspace
          path: workspace
      # Rebuild the workspace structure (only relevant repos), so that relative paths or references across repos work.
      - run: pipx install west
      - run: west init -l workspace
      - run: west update --narrow -o=--depth=1 corpus-note org
      # Install Node and build the static site.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm install
        working-directory: apps/note-docs-site
      - run: npm run docs:build
        working-directory: apps/note-docs-site
      - uses: actions/upload-artifact@v7
        with:
          name: docs-dist
          path: apps/note-docs-site/docs/.vitepress/dist
          retention-days: 1

# Deployments are triggered on merges to this repository (site changes), merges to the corpus-note repository (content changes), or a manual action (workflow) triggered via GitHub.
  deploy:
    needs: build
    if: >-
      github.ref == 'refs/heads/main' &&
      contains(fromJSON('["push", "repository_dispatch", "workflow_dispatch"]'), github.event_name)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # wrangler.jsonc lives in this repository; the built assets arrive from build as an artifact.
      - uses: actions/checkout@v7
        with:
          path: apps/note-docs-site
      - uses: actions/download-artifact@v8
        with:
          name: docs-dist
          path: apps/note-docs-site/docs/.vitepress/dist
      - uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/note-docs-site
          command: deploy
