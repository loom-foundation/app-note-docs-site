name: checks

# The site's words come from corpus-note, which cannot push here, so a merge
# there would otherwise leave the published site behind until something
# unrelated landed in this repository. Its workflow sends corpus-updated when
# main moves, and that rebuilds and redeploys exactly as a push here would.
# workflow_dispatch does the same by hand, from the Actions tab or `gh workflow
# run`, for when a deploy is wanted without a change to wait for.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  repository_dispatch:
    types: [corpus-updated]

jobs:
  build:
    # The site is built inside a west workspace, because that is what it reads: the docs come from corpus-note and the brand assets from org, each found by walking up for west's .west marker and descending from there.
    # Rather than mirror that layout by hand, the manifest repository is checked out and west is left to do it: `west init -l` registers the workspace, and `west update` places each named project at the path and revision the manifest declares.
    # Only the project names appear below. Where they land, and at which revision, stays in west.yml where it belongs.
    # west is held to a minor series: unpinned, a release of it could stop every build here without a line changing in any Loom repository.
    # The card the site carries is drawn during the build, by the Chrome the runner image already ships. Nothing installs a browser.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: apps/note-docs-site
      - uses: actions/checkout@v7
        with:
          repository: loom-foundation/workspace
          path: workspace
      - run: pipx install 'west~=1.5'
      - run: west init -l workspace
      - run: west update --narrow -o=--depth=1 corpus-note org
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm install
        working-directory: apps/note-docs-site
      - run: npm run docs:build
        working-directory: apps/note-docs-site
      - uses: actions/upload-artifact@v7
        with:
          name: docs-dist
          path: apps/note-docs-site/docs/.vitepress/dist
          retention-days: 1

  deploy:
    needs: build
    # Every way of arriving at main publishes it: a merge here, a merge in the
    # corpus, or a hand-started run. A pull request builds and stops.
    if: >-
      github.ref == 'refs/heads/main' &&
      contains(fromJSON('["push", "repository_dispatch", "workflow_dispatch"]'), github.event_name)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # wrangler.jsonc lives in this repository; the built assets arrive from build as an artifact.
      - uses: actions/checkout@v7
        with:
          path: apps/note-docs-site
      - uses: actions/download-artifact@v8
        with:
          name: docs-dist
          path: apps/note-docs-site/docs/.vitepress/dist
      - uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/note-docs-site
          command: deploy
