name: checks

# The site's content comes from corpus-note, which cannot push here. Its
# workflow asks this one to run when the docs it holds move, and a run started
# that way rebuilds and redeploys exactly as a push or merge here would. The
# same trigger serves a person: the Actions tab, or `gh workflow run checks.yml
# --ref main`, for when a deploy is wanted without a merge to wait for.
#
# Being asked to run, rather than being sent an event of its own, is what keeps
# the corpus's token to permission over runs alone. A repository dispatch would
# have required write access to everything in this repository to send the same
# request.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# This application depends on the following repositories:
# - workspace: List of repositories and their placement
# - corpus-note: Site content
# - org: Brand assets
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Check out note-docs-site via actions/checkout, so it lands on the exact PR/push ref being tested.
      - uses: actions/checkout@v7
        with:
          path: apps/note-docs-site
      # Check out the workspace, so other repositories this application depends on can be cloned.
      - uses: actions/checkout@v7
        with:
          repository: loom-foundation/workspace
          path: workspace
      # Rebuild the workspace structure (only relevant repos), so that relative paths or references across repos work.
      - run: pipx install west
      - run: west init -l workspace
      - run: west update --narrow -o=--depth=1 corpus-note org
      # Install Node and build the static site.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm install
        working-directory: apps/note-docs-site
      - run: npm run docs:build
        working-directory: apps/note-docs-site
      - uses: actions/upload-artifact@v7
        with:
          name: docs-dist
          path: apps/note-docs-site/docs/.vitepress/dist
          retention-days: 1

# Deployments are triggered on merges to this repository (site changes), merges to the corpus-note repository (content changes), or a manual action (workflow) triggered via GitHub.
  deploy:
    needs: build
    if: >-
      github.ref == 'refs/heads/main' &&
      contains(fromJSON('["push", "workflow_dispatch"]'), github.event_name)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # wrangler.jsonc lives in this repository; the built assets arrive from build as an artifact.
      - uses: actions/checkout@v7
        with:
          path: apps/note-docs-site
      - uses: actions/download-artifact@v8
        with:
          name: docs-dist
          path: apps/note-docs-site/docs/.vitepress/dist
      - uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/note-docs-site
          command: deploy
